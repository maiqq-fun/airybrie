<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="./images/shit3.png">
<meta name="apple-mobile-web-app-title" content="Airybrie">
<title>Airybrie</title>
<style>
:root{--ink:#392719;--cream:#fff3d7;--orange:#f3a43b;--yellow:#ffd66b;--brown:#6c4328;--shadow:0 7px 0 #6a452a55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink);background:#000000;touch-action:none}
button{font:inherit;cursor:pointer;color:inherit}
#app{position:relative;width:100%;height:100dvh;overflow:hidden;background:#000000;overscroll-behavior:none;touch-action:none}
.screen{position:absolute;inset:0;display:none;overflow:hidden;overscroll-behavior:none;touch-action:none}.screen.active{display:block}
#home{background:#f6bd5b url('./images/index.jpg') center center/cover no-repeat}
.home-menu{position:absolute;left:50%;top:70%;transform:translateX(-50%);width:min(88%,360px);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;z-index:3}
.home-text-btn{width:calc(50% - 5px);border:2.5px solid #392719;border-radius:999px;background:linear-gradient(#fff0c5,#ffd66b);color:#392719;padding:11px 9px;font-size:clamp(14px,4vw,18px);font-weight:1000;letter-spacing:.3px;box-shadow:0 5px 0 #6c4328,0 8px 14px #6c432833;text-shadow:0 1px #fff8e9;transition:transform .12s,filter .12s}.home-text-btn:first-child{width:100%;padding:15px 18px;font-size:clamp(23px,6vw,30px);letter-spacing:1px}
.home-text-btn:active{transform:translateY(3px) scale(.98);box-shadow:0 2px 0 #6c4328;filter:brightness(1.05)}
#gameScreen{background:#000000}
.ann-btn{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 12px);right:12px;border:2px solid var(--ink);border-radius:999px;background:#fff0d3e6;padding:7px 12px;font-size:14px;font-weight:900;box-shadow:2px 3px 0 #6b452833}
.ann-card{position:absolute;z-index:6;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);width:min(86vw,320px);border:2.5px solid var(--ink);border-radius:20px;overflow:hidden;background:rgba(255,247,226,.84);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 6px 0 rgba(108,67,40,.25),0 12px 26px rgba(0,0,0,.28);animation:annPop .26s cubic-bezier(.3,1.5,.5,1)}
.ann-card[hidden]{display:none}
@keyframes annPop{from{transform:translateX(-50%) scale(.82);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.ann-bar{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;background:rgba(255,214,107,.88);border-bottom:2.5px solid var(--ink)}
.ann-dots{display:flex;gap:4px}.ann-dots i{display:block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink)}.ann-dots i:nth-child(1){background:#ff8fa3}.ann-dots i:nth-child(2){background:#ffe27a}.ann-dots i:nth-child(3){background:#8fe3a8}
.ann-title{flex:1;font-size:14px;font-weight:1000}
.ann-x{width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;background:#ff9db0;font-size:12px;font-weight:1000;line-height:1;padding:0;box-shadow:1px 2px 0 #6b452855}
.ann-body{padding:12px 14px 6px;font-size:14px;font-weight:800;line-height:1.75;white-space:pre-line;text-align:left}
.ann-time{padding:0 14px 11px;font-size:11.5px;font-weight:800;opacity:.65;text-align:left}
#gameBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
#topbar{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.pill{background:#fff3d9eF;border:2.5px solid var(--ink);border-radius:999px;padding:6px 12px;font-weight:900;font-size:clamp(13px,3.8vw,17px);white-space:nowrap;box-shadow:2px 3px 0 #6b452833}
#gameTitle{font-weight:1000;font-size:clamp(22px,6.4vw,36px);letter-spacing:-1px;text-shadow:2px 2px #fff8e9,-2px -2px #fff8e9,2px -2px #fff8e9,-2px 2px #fff8e9;white-space:nowrap}
#gameTimer{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 58px);left:50%;transform:translateX(-50%);background:#fff3d9eF;border:2.5px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:900;font-size:clamp(13px,3.8vw,16px);font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:2px 3px 0 #6b452833;pointer-events:none}
#pauseBtn{position:absolute;z-index:6;right:14px;top:calc(env(safe-area-inset-top) + 62px);border:2px solid var(--ink);border-radius:50%;width:42px;height:42px;background:#fff0d3;font-weight:1000;box-shadow:2px 3px 0 #6b452833}
#audioControls{position:absolute;z-index:6;right:14px;top:calc(env(safe-area-inset-top) + 110px);display:flex;flex-direction:column;gap:7px}
.audioBtn{border:2px solid var(--ink);border-radius:999px;background:#fff0d3;padding:6px 10px;font-size:12px;font-weight:900;box-shadow:2px 3px 0 #6b452833;white-space:nowrap}
#player{position:absolute;z-index:3;width:clamp(115px,32vw,185px);height:auto;bottom:calc(env(safe-area-inset-bottom) + 22px);left:50%;transform:translateX(-50%);will-change:transform;touch-action:none;user-select:none;-webkit-user-select:none;pointer-events:none}
#items{position:absolute;inset:0;z-index:2;pointer-events:none}.fall{position:absolute;left:0;top:0;height:auto;max-width:none;will-change:transform;user-select:none;-webkit-user-select:none}
#notice{position:absolute;z-index:4;left:50%;top:calc(env(safe-area-inset-top) + 190px);transform:translateX(-50%);font-size:clamp(20px,5.8vw,29px);font-weight:1000;text-shadow:2px 2px #fff7e7,-2px -2px #fff7e7,2px -2px #fff7e7,-2px 2px #fff7e7;white-space:nowrap;pointer-events:none}
#toast{position:absolute;z-index:4;left:50%;top:calc(env(safe-area-inset-top) + 236px);transform:translateX(-50%);font-size:clamp(20px,5.8vw,29px);font-weight:1000;text-shadow:2px 2px #fff7e7,-2px -2px #fff7e7,2px -2px #fff7e7,-2px 2px #fff7e7;white-space:nowrap;pointer-events:none}
#combo{position:absolute;z-index:4;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-4deg);display:flex;align-items:baseline;gap:8px;opacity:.55;font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Avenir Next",system-ui,sans-serif;font-style:italic;font-weight:900;color:#fff3d7;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);white-space:nowrap;pointer-events:none;user-select:none;-webkit-user-select:none}#combo .cw{font-size:clamp(22px,6.5vw,32px);letter-spacing:2px;text-transform:uppercase;color:#ffd66b}#combo .cn{font-size:clamp(36px,11vw,54px);line-height:1}#combo[hidden]{display:none}
#dim{position:absolute;inset:0;z-index:1;background:#000;opacity:0;transition:opacity 3s;pointer-events:none}#dim.on{opacity:.25}
#aura{position:absolute;z-index:2;left:50%;top:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(140,190,255,0) 50%,rgba(140,190,255,.6) 66%,rgba(180,150,255,0) 80%);will-change:transform;animation:auraPulse .8s ease-in-out infinite alternate}@keyframes auraPulse{from{opacity:.5}to{opacity:1}}#aura[hidden]{display:none}
#guard{position:absolute;z-index:4;left:50%;top:0;border-radius:50%;pointer-events:none;border:3px solid rgba(190,245,255,.9);background:radial-gradient(circle at 50% 55%,rgba(120,220,255,.06) 40%,rgba(120,220,255,.28) 78%,rgba(190,250,255,.5) 100%);box-shadow:0 0 16px 4px rgba(120,220,255,.65),inset 0 0 20px rgba(200,250,255,.55);will-change:transform;animation:guardPulse .9s ease-in-out infinite alternate}
#guard::after{content:'';position:absolute;left:17%;top:11%;width:24%;height:11%;border-radius:50%;background:rgba(255,255,255,.7);transform:rotate(-38deg)}
@keyframes guardPulse{from{opacity:.7}to{opacity:1}}
#guard.warn{animation:guardWarn .3s steps(1) infinite}
@keyframes guardWarn{0%{opacity:1}50%{opacity:.2}}
#guard[hidden]{display:none}
#lives{position:absolute;z-index:5;left:14px;top:calc(env(safe-area-inset-top) + 108px);transform-origin:left center;font-size:22px;letter-spacing:3px;white-space:nowrap;pointer-events:none;user-select:none;-webkit-user-select:none}#lives[hidden]{display:none}
#overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;background:#4b2d1a66;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}#overlay[hidden]{display:none!important}
.modal{max-height:calc(100dvh - 48px);overflow-y:auto;width:min(88%,360px);border:3px solid var(--ink);border-radius:28px;background:var(--cream);padding:24px 20px;text-align:center;box-shadow:8px 8px 0 #6b452a88;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:.5}to{transform:scale(1);opacity:1}}
.modal h1{margin:0 0 10px;font-size:clamp(27px,8vw,39px);font-weight:1000;line-height:1.1}.modal h1.achievement-title{font-size:clamp(25px,7vw,34px);line-height:1.25;margin-bottom:14px}.modal h1.report-title{font-size:clamp(15px,4.8vw,25px);white-space:nowrap;letter-spacing:-.6px;line-height:1.2}.report-rank-title{font-size:clamp(22px,6.5vw,32px);font-weight:1000;white-space:nowrap;line-height:1.2;margin:2px 0 14px}.modal h1.survey-title{font-size:clamp(15px,4.5vw,22px);white-space:nowrap;letter-spacing:-.6px;line-height:1.2}.achievement-lines{display:flex;flex-direction:column;gap:5px;margin:8px 0 16px;font-size:clamp(20px,5.5vw,26px);font-weight:1000;line-height:1.25}.modal p{font-weight:800;line-height:1.65;margin:8px 0 18px}
.ach{font-weight:1000;margin:0 0 14px}
.ach.one{font-size:clamp(25px,7vw,34px);line-height:1.25;text-align:center}
.ach.two{display:grid;grid-template-columns:repeat(2,max-content);justify-content:center;column-gap:12px;row-gap:4px;text-align:left;white-space:nowrap;line-height:1.3}
.ach.a{font-size:clamp(13px,4.2vw,17px)}
.ach.b{font-size:clamp(12px,3.6vw,15px)}
.modalBtn{border:2.5px solid var(--ink);border-radius:18px;background:var(--orange);padding:11px 18px;font-size:18px;font-weight:1000;box-shadow:3px 4px 0 var(--ink);margin:5px;min-width:112px;transition:transform .12s,filter .12s}.modalBtn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink);filter:brightness(1.05)}.modalBtn.secondary{background:#f7dfaa}.row{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
#backHome{position:absolute;z-index:8;left:12px;top:calc(env(safe-area-inset-top) + 62px);border:2px solid var(--ink);border-radius:999px;background:#fff0d3;padding:7px 12px;font-weight:900;box-shadow:2px 3px 0 #6b452833}
@media (min-width:700px){#home{background-size:contain;background-color:#000000}#gameScreen{max-width:520px;left:50%;transform:translateX(-50%);width:100%;border-left:2px solid #5b3b2555;border-right:2px solid #5b3b2555}}

.profile-input-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0 16px;font-weight:1000;font-size:18px}.profile-input-row label{white-space:nowrap}.profile-input{width:130px;min-width:0;border:2px solid var(--ink);border-radius:12px;padding:9px 10px;background:#fffdf4;color:var(--ink);font:inherit;font-weight:900;text-align:center}.small-note{font-size:12px!important;opacity:.72;margin:10px 0!important}.panel-list{display:flex;flex-direction:column;gap:8px;text-align:left;margin:12px 0}.panel-row{border:2px solid #6c4328;border-radius:14px;background:#fff8e8;padding:9px 11px;font-weight:900;line-height:1.45}.panel-row small{display:block;font-size:12px;opacity:.7}.tab-row{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin:10px 0}.tab-btn{border:2px solid var(--ink);border-radius:999px;background:#f7dfaa;padding:7px 11px;font-weight:1000}.tab-btn.active{background:var(--orange)}.field-label{display:block;text-align:left;font-weight:1000;margin:12px 0 5px}.survey-select{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}.survey-option{border:2px solid var(--ink);border-radius:14px;background:#fff8e8;padding:8px 10px;font-weight:900}.survey-option.selected{background:#ffd66b;box-shadow:2px 3px 0 var(--ink)}.survey-text{width:100%;min-height:76px;border:2px solid var(--ink);border-radius:12px;padding:10px;background:#fffdf4;color:var(--ink);font:inherit;resize:vertical}.rank-number{display:inline-block;min-width:26px;font-weight:1000}
.tab-row{flex-wrap:nowrap}.tab-btn{padding:7px 9px;font-size:15px;white-space:nowrap}
.panel-row.lb{display:flex;align-items:center;gap:8px}.panel-row.lb .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.panel-row.mine{background:#ffe9a8}
.modal p.newbest{margin:-6px 0 8px;font-size:19px;font-weight:1000}.modal p.up{white-space:pre-line;margin:0 0 14px;font-size:13px;opacity:.8;min-height:1.4em}
.modalBtn:disabled{opacity:.6;filter:grayscale(.35);transform:none;box-shadow:3px 4px 0 var(--ink);cursor:default}
.fun-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:4px 2px 6px}
.fun-tile{border:2.5px solid var(--ink);border-radius:16px;background:linear-gradient(#fff8e8,#ffe9b5);padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 3px 0 var(--ink);transition:transform .12s,background .12s,box-shadow .12s}
.fun-tile .fe{font-size:24px;line-height:1.15}.fun-tile .fn{font-size:14px;font-weight:1000}
.fun-tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.fun-tile.selected{background:linear-gradient(#ffe27a,#f3a43b);transform:translateY(-3px) scale(1.08);box-shadow:0 5px 0 var(--ink)}
.diff-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.diff-row .survey-option{padding:9px 6px}
.survey-msg{min-height:1.4em;margin:4px 0 8px!important;font-size:14px;color:#b3261e}
#devBadge{position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom) + 6px);z-index:50;font-size:12px;font-weight:900;background:#ffeb99;border:2px solid var(--ink);border-radius:999px;padding:3px 9px;pointer-events:none;opacity:.92}
.modal p.newbest+p.newbest{margin-top:0}
.modal.sel{display:flex;flex-direction:column;overflow:hidden;padding:18px 14px 14px}
.modal.sel h1.sel-title{margin:0 0 2px;font-size:clamp(22px,6.4vw,30px)}
.modal p.sel-sub{margin:2px 0 8px;font-size:14px}
.sel-grid{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 3px 8px}
.ch-card{border:2.5px solid var(--ink);border-radius:16px;background:linear-gradient(#fff8e8,#ffe9b5);padding:6px 6px 7px;box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .12s,box-shadow .12s,background .12s}
.ch-card:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ch-pic{width:100%;aspect-ratio:1/.9;border-radius:11px;overflow:hidden;background:#f1dfb4}
.ch-pic img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 0%;pointer-events:none}   /* 半身：只顯示上半部；想多露出一點，把 0% 調大（例如 15%） */
.ch-card.locked{background:linear-gradient(#efe6d0,#e2d5b3)}
.ch-card.locked .ch-pic img{filter:brightness(0);opacity:.78}   /* 鎖住：剪影 */
.ch-card.selected{background:linear-gradient(#ffe27a,#f3a43b);transform:translateY(-2px);box-shadow:0 5px 0 var(--ink)}
.ch-name{font-weight:1000;font-size:15px;line-height:1.2}
.ch-sub{font-size:12px;font-weight:800;opacity:.75;min-height:1.2em}
.modal.sel .modalBtn{min-width:0;padding:10px 14px;font-size:17px;margin:3px}
.modal p.sel-info{min-height:2.7em;margin:6px 0;font-size:14px;font-weight:900;line-height:1.35}
</style>
</head>
<body>
<div id="app">
  <section id="home" class="screen active" aria-label="首頁">
    <button id="annBtn" class="ann-btn" aria-label="公告">👽公告</button>
    <div id="annCard" class="ann-card" role="dialog" aria-label="公告" hidden>
      <div class="ann-bar"><span class="ann-dots"><i></i><i></i><i></i></span><span class="ann-title">👽公告</span><button id="annClose" class="ann-x" aria-label="關閉公告">✕</button></div>
      <div class="ann-body" id="annBody"></div>
      <div class="ann-time" id="annTime"></div>
    </div>
    <div class="home-menu"><button id="homeStart" class="home-text-btn">🎮開始遊戲🎮</button><button id="homeReport" class="home-text-btn">📝我的成績單📝</button><button id="homeRank" class="home-text-btn">🏆排行榜🏆</button></div>
  </section>
  <section id="gameScreen" class="screen" aria-label="遊戲畫面">
    <img id="gameBg" src="./images/manbg.png" alt="遊戲背景"><div id="dim"></div>
    <div id="topbar"><div class="pill">分數 <span id="score">0</span></div><div id="gameTitle">✦ 無名貓奴 ✦</div><div class="pill">最高 <span id="best">0</span></div></div>
    <div id="gameTimer">⏱00:00</div>
    <button id="backHome">👾首頁</button><button id="pauseBtn" aria-label="暫停">Ⅱ</button>
    <div id="audioControls"><button id="musicBtn" class="audioBtn" aria-label="切換背景音樂">🎵音樂：開</button><button id="soundBtn" class="audioBtn" aria-label="切換遊戲音效">🔊音效：開</button></div>
    <div id="aura" hidden></div><div id="guard" hidden></div><div id="items"></div><div id="notice"></div><div id="toast"></div><div id="combo" hidden></div><div id="lives" hidden></div><img id="player" src="./images/man.png" alt="玩家角色">
  </section>
  <div id="overlay" hidden><div class="modal" id="modalContent"></div></div>
</div>
<div id="devBadge" hidden>🛠️工程師模式</div>
<script>
(()=>{
'use strict';
/* ==================== 角色設定（要新增 / 修改角色，只改這一區）====================
   每個角色一塊 { … },  欄位說明：
     id      代號（英文，不能重複，已經上線的不要改）
     name    顯示的名字
     img     角色圖檔名（在 images 資料夾；沒寫副檔名會自動補 .png）
     bg      背景圖檔名（同上）
     unlock  解鎖條件：null = 一開始就有；或 { type:'…', value:數字 }
               type 可填：
               'games'     累計場數           value 例：5
               'achs'      成就收藏數         value 例：10（填 'all' = 全部成就）
               'combo'     最高連擊           value 例：100
               'totalTime' 累計遊玩秒數       value 例：900（= 15 分鐘）
               'score'     最高分數           value 例：4000
               'time'      單局最長存活秒數   value 例：90
               'ach'       指定成就           value 例：'神級貓奴'
     hint    鎖住時顯示的提示文字
     hidden  true = 沒解鎖前名字顯示 ❔❔❔
   注意：每塊後面的逗號、引號 ' ' 都要成對，不要漏。
   設定寫錯的角色會被略過（工程師模式下選角畫面會顯示哪個有問題）。 */
const CHARACTERS=[
  {id:'man',     name:'帥哥',     img:'man.png',   bg:'manbg.png',   unlock:null},
  {id:'woman',   name:'美女',     img:'woman.png', bg:'womanbg.png', unlock:null},
  {id:'busy',    name:'就很忙',   img:'m6.png',    bg:'bg6.png',     unlock:{type:'games',value:5},        hint:'累計玩5場解鎖'},
  {id:'mount',   name:'山系妹子', img:'m7.png',    bg:'bg7.png',     unlock:{type:'achs',value:5},         hint:'收集5個成就解鎖'},
  {id:'fish',    name:'周魚民',   img:'m5',        bg:'bg5',         unlock:{type:'combo',value:100},      hint:'連擊破百解鎖'},
  {id:'by2',     name:'by2',      img:'m1',        bg:'bg1',         unlock:{type:'totalTime',value:900},  hint:'累計遊玩15分鐘解鎖'},
  {id:'monkey',  name:'山道猴子', img:'m2',        bg:'bg2',         unlock:{type:'achs',value:10},        hint:'收集10個成就解鎖'},
  {id:'snow',    name:'阿雪',     img:'m4',        bg:'bg4',         unlock:{type:'score',value:4000},     hint:'單局4000分解鎖'},
  {id:'sleep',   name:'站著睡',   img:'m3',        bg:'bg3',         unlock:{type:'time',value:90},        hint:'單局存活90秒解鎖'},
  {id:'intruder',name:'入侵者',   img:'m8',        bg:'bg8',         unlock:{type:'achs',value:'all'},     hint:'收集全部成就解鎖', hidden:true},
];

async function apiFetch(url,opt){

/* ----- 成績上傳：先放進待傳清單，成功才移除；失敗會在下次連線 / 回到遊戲時自動補傳 ----- */
const upState=new Map();   // gameId -> 'pending' | 'ok' | 'fail'
const UP_TEXT={pending:'🛸成績上傳中…',ok:'🚀成績已上傳',fail:'💨上傳失敗 下次連線會自動補傳',dev:'🛠️工程師模式 不上傳成績'};
const upText=g=>{const k=upState.get(g)||'';return k==='fail'&&lastApiErr?UP_TEXT.fail+'\n（'+lastApiErr+'）':(UP_TEXT[k]||'');};
const getQueue=()=>{const q=readJSON(QUEUE_KEY,[]);return Array.isArray(q)?q:[];};
const setQueue=q=>writeJSON(QUEUE_KEY,q.slice(-30));
function refreshUpStatus(){const el=$('#upStatus');if(el)el.textContent=upText(el.dataset.gid);}
let flushing=null;
function flushQueue(){
  if(flushing)return flushing;
  flushing=(async()=>{
    {
      for(;;){
        const q=getQueue();if(!q.length)break;
        const it=q[0];let ok=false;
        try{const r=await apiPost({action:'score',pid:profile.id,name:profile.nickname,score:it.score,combo:it.combo,time:it.time});ok=!!(r&&r.ok);}catch(e){}
        if(!ok){getQueue().forEach(x=>upState.set(x.gameId,'fail'));refreshUpStatus();break;}
        setQueue(getQueue().filter(x=>x.gameId!==it.gameId));upState.set(it.gameId,'ok');refreshUpStatus();
      }
    }
  })().finally(()=>{flushing=null;});   // 注意：要在指定給 flushing 之後才清掉，所以用 finally 回呼
  return flushing;
}
function enqueue(item){const q=getQueue();q.push(item);setQueue(q);upState.set(item.gameId,'pending');flushQueue();}

/* ----- 一局結束 / 中途離開：記錄累計統計並排入上傳 ----- */
function recordRun(force){
  if(lastRec&&lastRec.gameId===currentGameId)return lastRec;
  const sc=Number(score)||0, tm=Math.floor(elapsed)||0;
  if(!force&&sc<=0&&tm<3)return null;
  const rec={gameId:currentGameId,score:sc,combo:Number(maxCombo)||0,time:tm,achievements:[...runAchievements],newBest:sc>0&&sc>bestAtStart};
  if(devMode){lastRec=rec;upState.set(rec.gameId,'dev');return rec;}   // 工程師模式：不計入累計、不上傳
  const st=profile.stats;st.games++;st.totalTime+=tm;
  for(const a of rec.achievements)if(!st.achs.includes(a))st.achs.push(a);
  const fresh=CHARS.filter(c=>realUnlocked(c)&&!(profile.seenUnlocked||[]).includes(c.id));
  if(fresh.length){profile.seenUnlocked=[...(profile.seenUnlocked||[]),...fresh.map(c=>c.id)];rec.newChars=fresh.map(c=>c.name);}
  writeJSON(PROFILE_KEY,profile);
  lastRec=rec;
  enqueue({gameId:rec.gameId,score:rec.score,combo:rec.combo,time:rec.time});
  return rec;
}

/* ----- 角色解鎖判斷 ----- */
function charProgress(c){
  const u=c.unlock;if(!u)return {ok:true};
  const st=playerStats();
  if(u.type==='ach'){const has=st.achievements.includes(u.value);return {ok:has,short:'',long:''};}
  const t=u.value==='all'?achievementDefs.length:Number(u.value);
  let cur=0,short='',long='';
  switch(u.type){
    case 'games':cur=st.games;short=cur+'/'+t;long='累計 '+cur+' / '+t+' 場';break;
    case 'achs':cur=st.achievements.length;short=cur+'/'+t;long='已收集 '+cur+' / '+t+' 個';break;
    case 'combo':cur=st.bestCombo;short=cur+'/'+t;long='最高連擊 '+cur+' / '+t;break;
    case 'totalTime':cur=st.totalTime;short=Math.floor(cur/60)+'/'+Math.floor(t/60)+'分';long='累計 '+formatGameTime(cur)+' / '+formatGameTime(t);break;
    case 'score':cur=st.bestScore;short=cur+'/'+t;long='最高分數 '+cur+' / '+t;break;
    case 'time':cur=st.bestTime;short=cur+'/'+t+'秒';long='最長存活 '+formatGameTime(cur)+' / '+formatGameTime(t);break;
  }
  return {ok:cur>=t,short,long};
}

const urlCache=new Map(), keepAlive=[], glowFrac=new Map(), missing=new Set();   // missing：載入失敗（沒上傳）的圖，不會被抽成道具
const glowSpecials=['x2.png','x3.png','x5.png','x6.png','x8.png'];   // 這幾種道具偶爾會變成放大版（x1、x4、x7 不會）
const glowNames=['a1','a2','a3','a4','a5','b1','b2','b3','b4','b5'].map(n=>n+'.png').concat(glowSpecials);   // 需要預先畫光暈版的圖
// 放大倍率、下墜減速、出現機率（想微調就改這裡）

const img=name=>urlCache.get(name)||IMG_DIR+name;   // 縮圖失敗時自動退回原圖

const toURL=c=>new Promise(res=>c.toBlob(b=>res(b?URL.createObjectURL(b):null),'image/png'));
function prewarm(u){const pre=new Image();pre.src=u;keepAlive.push(pre);if(pre.decode)pre.decode().catch(()=>{});}
function shrink(name,max){
  return new Promise(resolve=>{
    const im=new Image();
    im.decoding='async';
    im.onload=async()=>{
      try{
        const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
        const w=Math.max(1,Math.round(im.naturalWidth*k)), h=Math.max(1,Math.round(im.naturalHeight*k));
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const g=c.getContext('2d');g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(im,0,0,w,h);
        const u=await toURL(c);if(u){urlCache.set(name,u);prewarm(u);}
        c.width=c.height=0;
        if(glowNames.includes(name)){           // 巨大帽子用的金色光暈版本（同一張圖，事先畫好，遊戲中不耗效能）
          const P=Math.round(w*.1);
          const c2=document.createElement('canvas');c2.width=w+2*P;c2.height=h+2*P;
          const g2=c2.getContext('2d');g2.imageSmoothingEnabled=true;g2.imageSmoothingQuality='high';
          g2.shadowColor='rgba(255,205,70,1)';g2.shadowBlur=P*.9;
          g2.drawImage(im,P,P,w,h);g2.drawImage(im,P,P,w,h);
          const u2=await toURL(c2);
          if(u2){urlCache.set('glow_'+name,u2);glowFrac.set(name,w/(w+2*P));prewarm(u2);}
          c2.width=c2.height=0;
        }
      }catch(e){}
      resolve();
    };
    im.onerror=()=>{missing.add(name);resolve();};
    im.src=IMG_DIR+name;
  });
}
let assetsReady=false;
const queue=sizedNames.slice();
const worker=async()=>{while(queue.length){const [n,m]=queue.shift();await shrink(n,m);}};
const readyPromise=Promise.all([worker(),worker(),worker()]).then(()=>{assetsReady=true;});

/* ========== 音效 ========== */
const soundFiles={click:IMG_DIR+'click.mp3',pop:IMG_DIR+'pop.mp3',jump:IMG_DIR+'jump2.mp3',poo:IMG_DIR+'poo.mp3',music:IMG_DIR+'music2.mp3'};
const poolSize={click:2,pop:3,jump:2,poo:1};
const soundPools={}, effectCursor={};
for(const name in poolSize){
  effectCursor[name]=0;
  soundPools[name]=Array.from({length:poolSize[name]},()=>{const a=new Audio(soundFiles[name]);a.preload='auto';a.volume=name==='poo'?1:.8;a.playsInline=true;a.load();return a;});
}
const bgMusic=new Audio(soundFiles.music);bgMusic.preload='auto';bgMusic.loop=true;bgMusic.volume=.45;bgMusic.playsInline=true;bgMusic.load();
let musicEnabled=true, soundEnabled=true;
// 音效改用 Web Audio：解碼一次、播放不卡主執行緒（失敗時自動退回 Audio 元素）
let actx=null;const buffers={},gains={};
try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){actx=new AC();for(const n in poolSize){const g=actx.createGain();g.gain.value=n==='poo'?1:.8;g.connect(actx.destination);gains[n]=g;}}}catch(e){actx=null;}
let audioDone=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const audioPromise=(async()=>{if(actx)for(const n in poolSize){try{const r=await fetch(soundFiles[n]);if(!r.ok)continue;const ab=await r.arrayBuffer();buffers[n]=await new Promise((ok,no)=>{const p=actx.decodeAudioData(ab,ok,no);if(p&&p.catch)p.catch(no);});}catch(e){}}
  // 背景音樂：等它載入到可以播放（iOS 常常不預載，所以最多等 2.5 秒）
  await Promise.race([new Promise(res=>{if(bgMusic.readyState>=3)return res();bgMusic.addEventListener('canplaythrough',res,{once:true});bgMusic.addEventListener('error',res,{once:true});}),sleep(2500)]);
})().then(()=>{audioDone=true;});
const resumeCtx=()=>{try{if(actx&&actx.state!=='running')actx.resume();}catch(e){}};
const safePlay=(a,tag)=>{try{const r=a.play();if(r&&r.catch)r.catch(e=>console.warn(tag,e));}catch(e){console.warn(tag,e);}};
function updateAudioButtons(){
  musicBtn.textContent=`🎵音樂：${musicEnabled?'開':'關'}`;
  soundBtn.textContent=`🔊音效：${soundEnabled?'開':'關'}`;
  musicBtn.setAttribute('aria-pressed',String(musicEnabled));
  soundBtn.setAttribute('aria-pressed',String(soundEnabled));
}
function playEffect(name){
  if(!soundEnabled)return;
  if(actx&&buffers[name]){try{resumeCtx();const src=actx.createBufferSource();src.buffer=buffers[name];src.connect(gains[name]);src.start(0);return;}catch(e){}}
  const pool=soundPools[name];if(!pool)return;
  const s=pool[effectCursor[name]++%pool.length];
  try{s.pause();s.currentTime=0;}catch(e){}
  safePlay(s,'音效播放失敗：'+name);
}
const playClick=()=>playEffect('click');
let musicWanted=false;
function startMusic(){if(!musicEnabled)return;musicWanted=true;try{bgMusic.pause();bgMusic.currentTime=0;bgMusic.muted=false;}catch(e){}safePlay(bgMusic,'背景音樂播放失敗');}
function stopMusic(){musicWanted=false;try{bgMusic.pause();bgMusic.currentTime=0;}catch(e){}}
// iOS 需要使用者第一次點擊時「解鎖」每個音訊，之後才能在遊戲中自由播放
let audioUnlocked=false;
function unlockAudio(){
  resumeCtx();if(audioUnlocked)return;audioUnlocked=true;
  const all=[bgMusic,...Object.values(soundPools).flat()];
  for(const a of all){
    try{a.muted=true;const r=a.play();
      const done=()=>{if(a===bgMusic&&musicWanted){a.muted=false;return;}   // 遊戲已經開始播音樂了，不要把它關掉
        try{a.pause();a.currentTime=0;}catch(e){}a.muted=false;};
      if(r&&r.then)r.then(done).catch(()=>{a.muted=false;});else done();
    }catch(e){a.muted=false;}
  }
}

function noticeSchedule(){

  if(noticeQ.length){
    noticeCur=noticeQ.shift();noticeStart=performance.now();
    if(noticeEl.getAnimations)noticeEl.getAnimations().forEach(a=>a.cancel());
    noticeEl.textContent=noticeCur.text;popAnim(noticeEl,true);noticeSchedule();
  }else{
    noticeCur=null;
    if(noticeEl.animate&&noticeEl.textContent){
      const a=noticeEl.animate([{opacity:1},{opacity:0}],{duration:220,fill:'forwards'});
      a.onfinish=()=>{if(!noticeCur){noticeEl.textContent='';a.cancel();}};
    }else noticeEl.textContent='';
  }
}
function showNotice(text,dur=2200){
  noticeQ.push({text,dur});if(noticeQ.length>3)noticeQ.shift();
  if(!noticeCur)noticeNext();else noticeSchedule();
}
function noticeClear(){
  clearTimeout(noticeTimer);noticeQ=[];noticeCur=null;
  if(noticeEl.getAnimations)noticeEl.getAnimations().forEach(a=>a.cancel());
  noticeEl.textContent='';
}
function unlockCheck(){
  for(const a of achievementDefs){
    if(a.test()&&!unlockedThisRun.has(a.id)){unlockedThisRun.add(a.id);runAchievements.push(a.name);showNotice('🏅成就解鎖：'+a.name,2600);}
  }
}
function addScore(n){
  score+=n;scoreEl.textContent=score;
  if(score>best){best=score;bestDirty=true;bestEl.textContent=best;}
  unlockCheck();
}
function activateSpecial(src,big){
  const dur=big?10:5, N=2200;
  if(src!=='x5.png')specialCount++;   // 所有 x 系列都累積，唯獨 x5 大便雨不計
  if(src==='x1.png'){addScore(500);showNotice('🪎+500',N);}
  else if(src==='x2.png'){comboTimer=dur;showNotice(big?'🕹️10倍得分10秒鐘':'🕹️10倍得分 5秒鐘',N);}
  else if(src==='x3.png'){stormTimer=dur;showNotice(big?'😾非常有貓膩':'🐱有貓膩',N);}
  else if(src==='x4.png'){addScore(1000);showNotice('🌱+1000',N);}
  else if(src==='x6.png'){magnetTimer=dur;setAura(true);showNotice(big?'🧲吸引力法則 10秒鐘':'🧲強力磁鐵 5秒鐘',N);}
  else if(src==='x7.png'){lives=Math.min(3,lives+1);renderLives(true);showNotice('🧻守護天屎降臨',N);}
  else if(src==='x8.png'){guardTimer=dur;setGuard(true);showNotice(big?'🛡️屎不了 10秒鐘':'🛡️不怕屎 5秒鐘',N);}
  else if(src==='x5.png'){
    poopRainTimer=dur;
    for(const o of objects){
      const h=pick(hazards);
      releaseElement(o.el);
      o.bad=true;o.kind='bad';o.points=0;o.giant=false;o.pulse=0;o.inset=.16;o.src=h.src;o.size=h.size;
      o.el=acquireElement(h.src);o.el.style.width=h.size+'px';o.el.style.height='auto';
      o.el.style.transform=`translate3d(${o.x}px,${o.y}px,0) rotate(${o.rot}deg)`;
    }
    showNotice(big?'☠️危險 屎定了':'💣糟糕 屎在滾',N);
  }
}
function pickHazard(){return {...pick(hazards),kind:'bad',big:Math.random()<BIGPOOP_CHANCE};}
function weightedItem(){
  if(poopRainTimer>0)return pickHazard();
  if(stormTimer>0||magnetTimer>0)return {...pick(common),kind:'normal'};   // 貓咪大雨、磁鐵期間：只掉帽子、量大
  // 衛生紙：獨立計時器（沒有衛生紙時更常出現），畫面上同時只會有一個
  if(shieldTimer<=0&&lives<3&&!objects.some(o=>o.src==='x7.png')){
    shieldTimer=(lives===0?18:28)+Math.random()*10;
    return {src:'x7.png',kind:'special',points:0};
  }
  // 其他特殊道具有自己的計時器，且不會連續出現同一種；有限時效果進行中時不出新道具
  const busy=comboTimer>0||stormTimer>0||poopRainTimer>0||magnetTimer>0||guardTimer>0;
  if(specialSpawnTimer<=0&&!busy){
    const giantOn=objects.some(o=>o.giant);
    const pool=specials.filter(s=>s!==lastSpecialSrc&&!(giantOn&&s==='x2.png')&&!missing.has(s));   // 巨大帽子在場時不出肉泥
    if(pool.length){const src=pick(pool);lastSpecialSrc=src;specialSpawnTimer=10+Math.random()*5;return {src,kind:'special',points:0,giant:glowSpecials.includes(src)&&Math.random()<GIANT_SPECIAL_CHANCE};}
    specialSpawnTimer=4;
  }
  // 巨大帽子：分數 10 倍；肉泥生效中或畫面上有肉泥時不出現，所以不會有倍數疊加
  if(giantTimer<=0&&comboTimer<=0&&!objects.some(o=>o.src==='x2.png')){
    giantTimer=20+Math.random()*10;
    const c=pick(common);
    return {...c,kind:'normal',giant:true,points:c.points*10};
  }
  const roll=Math.random();
  if(roll<.78)return {...pick(common),kind:'normal'};
  const hazardChance=Math.min(.18,.08+elapsed/240)*(calmOn?CALM_POOP:1);
  if(roll<.78+hazardChance)return pickHazard();
  return {...pick(common),kind:'normal'};
}
function makeItem(){
  const objectLimit=(stormTimer>0||magnetTimer>0)?15:30;
  if(objects.length>=objectLimit){const oldest=objects.shift();if(oldest&&oldest.el)releaseElement(oldest.el);}
  const data=weightedItem();
  const normalSize=Math.max(58,Math.min(108,innerWidth*.18));
  let size, inset=.16, key=data.src;
  if(data.giant){
    // 放大版：使用預先畫好金色光暈的同一張圖（光暈佔外圈，碰撞範圍仍以本體計算）
    const frac=glowFrac.get(data.src);
    if(frac&&urlCache.has('glow_'+data.src)){key='glow_'+data.src;size=normalSize*GIANT_SCALE/frac;inset=.5-.34*frac;}
    else size=normalSize*GIANT_SCALE;
  }else if(data.kind==='bad'){
    size=Math.min(data.size||58,Math.max(42,innerWidth*.22));
    if(data.big)size*=BIGPOOP_SCALE;                 // 巨型大便
  }else size=(data.kind==='special'&&data.src==='x4.png')?normalSize*X4_SCALE:normalSize;
  const el=acquireElement(key);
  el.style.width=size+'px';el.style.height='auto';
  el.style.transform='translate3d(0,'+(-size)+'px,0)';
  const x=Math.random()*Math.max(1,W-size), y=-size;
  const base=280+Math.min(elapsed,90)*8;
  let speed=base+(data.kind==='bad'?(Math.random()*90+65)*(data.speed||1):data.kind==='special'?Math.random()*90+30:Math.random()*100-20);
  if(data.giant)speed*=GIANT_SLOW;else if(data.big)speed*=BIGPOOP_SLOW;   // 放大的東西掉得比較慢
  objects.push({el,x,y,size,rot:Math.random()*70-35,spin:Math.random()*300-150,speed,points:data.points||0,bad:data.kind==='bad',kind:data.kind,src:data.src,giant:!!data.giant,pulse:(data.giant||data.big)?1:0,ph:Math.random()*6.28,inset,off:(Math.random()-.5)*pw*.6});
}
function loop(t){
  if(!running)return;
  if(paused){raf=requestAnimationFrame(loop);return;}
  if(!W||!pw)updateMetrics();
  const dt=Math.min((t-last)/1000,.045);last=t;elapsed+=dt;gameTimerEl.textContent='⏱'+formatClock(elapsed);
  comboTimer=Math.max(0,comboTimer-dt);stormTimer=Math.max(0,stormTimer-dt);poopRainTimer=Math.max(0,poopRainTimer-dt);
  magnetTimer=Math.max(0,magnetTimer-dt);if(magnetTimer<=0&&!auraEl.hidden)setAura(false);
  if(guardTimer>0){guardTimer=Math.max(0,guardTimer-dt);guardEl.classList.toggle('warn',guardTimer>0&&guardTimer<1.5);if(guardTimer<=0)setGuard(false);}   // 最後 1.5 秒閃爍提醒
  // 喘息期：每 CALM_EVERY 秒一次、持續 CALM_LEN 秒；速度是漸進變慢 / 變回來，不會突然跳
  const calmNow=elapsed>=CALM_EVERY&&(elapsed%CALM_EVERY)<CALM_LEN;
  if(calmNow!==calmOn){calmOn=calmNow;showNotice(calmOn?'😪喘口氣':'🔥跑酷時間',2000);}
  calmMul+=((calmOn?CALM_SPEED:1)-calmMul)*Math.min(1,3*dt);
  invulnTimer=Math.max(0,invulnTimer-dt);
  giantTimer-=dt;shieldTimer-=dt;
  if(!(comboTimer>0||stormTimer>0||poopRainTimer>0||magnetTimer>0||guardTimer>0))specialSpawnTimer-=dt;
  if(dimmed&&!dimEnded&&elapsed>=55){dimEnded=true;dimEl.classList.remove('on');}   // 變暗 15 秒後恢復
  if(elapsed>bestTime){bestTime=elapsed;bestTimeDirty=true;}
  if(!dimmed&&elapsed>=40){dimmed=true;dimEl.classList.add('on');showNotice('⚡️神經反射超越人類⚡️',2600);}
  spawnTimer+=dt;
  const rain=stormTimer>0||magnetTimer>0;
  const interval=rain?.22:Math.max(.36,.86-elapsed*.005);
  if(spawnTimer>=interval){spawnTimer=0;if(rain){if(objects.length<15)makeItem();}else makeItem();}
  // 玩家碰撞框：全部用快取數值計算，不讀取 DOM
  const ph=pbot-ptop, cx=px*W;
  const pL=cx-pw/2+pw*.14, pR=cx+pw/2-pw*.14, pT=ptop+ph*.14, pB=pbot-ph*.14;
  for(let i=objects.length-1;i>=0;i--){
    const o=objects[i];
    o.y+=o.speed*dt*calmMul;
    // 磁鐵：全螢幕的好東西（不吸大便、不吸死魚）會自己橫向飄向角色（各自有一點偏移，不會疊成一條），下落速度不變
    if(magnetTimer>0&&!o.bad&&o.src!=='x5.png'&&o.y>0&&o.y+o.size<pB){
      o.x+=(cx+o.off-(o.x+o.size/2))*Math.min(1,5*dt);
    }
    if(rain)o.spin=0;else o.rot+=o.spin*dt;
    o.el.style.transform=`translate3d(${o.x}px,${o.y}px,0) rotate(${o.rot}deg)`+(o.pulse?` scale(${(1+.05*Math.sin(elapsed*5+o.ph)).toFixed(3)})`:'');
    const ins=o.inset||.16, l=o.x+o.size*ins, r=o.x+o.size*(1-ins), tp=o.y+o.size*ins, bt=o.y+o.size*(1-ins);
    // 防護罩期間：大便只要碰到泡泡（圓形）就被擋下，不會致死，也不算閃過
    if(o.bad&&guardTimer>0){
      const dx=o.x+o.size/2-cx, dy=o.y+o.size/2-guardCY, rr=guardR+o.size*.25;
      if(dx*dx+dy*dy<rr*rr){playEffect('pop');if(guardEl.animate)guardEl.animate([{filter:'brightness(2.2)'},{filter:'brightness(1)'}],{duration:200});releaseElement(o.el);objects.splice(i,1);continue;}
    }
    if(bt>pT+12&&tp<pB-8&&r>pL+10&&l<pR-10){
      if(o.bad){
        if(guardTimer>0){                                 // 防護罩擋下大便（不算閃過）
          playEffect('pop');if(guardEl.animate)guardEl.animate([{filter:'brightness(2.2)'},{filter:'brightness(1)'}],{duration:200});
          releaseElement(o.el);objects.splice(i,1);continue;
        }
        if(invulnTimer>0)continue;                       // 衛生紙觸發後的短暫無敵：大便直接穿過
        if(lives>0){                                      // 衛生紙擋下大便
          lives--;renderLives(false);invulnTimer=1;playEffect('pop');
          if(player.animate)player.animate([{opacity:1},{opacity:.25},{opacity:1}],{duration:250,iterations:4});
          releaseElement(o.el);objects.splice(i,1);continue;
        }
        if(gameOverPending)return;
        gameOverPending=true;running=false;cancelAnimationFrame(raf);playEffect('poo');setTimeout(finishGame,900);return;
      }
      if(o.kind==='special'){playEffect('jump');comboHit();activateSpecial(o.src,o.giant);}
      else{
        playEffect(o.giant?'jump':'pop');
        const pts=o.giant?o.points:o.points*(comboTimer>0?10:1);
        addScore(pts);comboHit();showToast('+'+pts,1100,o.giant);
      }
      releaseElement(o.el);objects.splice(i,1);
    }else if(o.y>H+100){
      if(o.bad){if(guardTimer<=0){poopDodged++;unlockCheck();}}else if(o.kind==='normal')comboBreak();   // 防護罩期間掉出去的大便不算閃過
      releaseElement(o.el);objects.splice(i,1);
    }
  }
  unlockCheck();
  if(running)raf=requestAnimationFrame(loop);
}

/* ========== 操作 / 事件 ========== */
function pointer(e){if(!W)updateMetrics();setPlayer((e.clientX-screenLeft)/W);}
gameScreen.addEventListener('touchmove',e=>{if(running)e.preventDefault();},{passive:false});
gameScreen.addEventListener('pointerdown',e=>{if(!running||paused)return;pointer(e);});
gameScreen.addEventListener('pointermove',e=>{if(!running||paused)return;if(e.buttons||e.pointerType==='touch')pointer(e);});
$('#homeStart').onclick=chooseModal;
$('#homeReport').onclick=openReport;
$('#homeRank').onclick=()=>loadBoard('score');
pauseBtn.onclick=pauseGame;
$('#backHome').onclick=()=>{if(running||gameOverPending)recordRun(false);boardTok++;running=false;gameOverPending=false;cancelAnimationFrame(raf);stopMusic();saveBest();noticeClear();hideModal();pauseBtn.hidden=true;comboEl.hidden=true;setAura(false);setGuard(false);livesEl.hidden=true;showScreen('home');};
musicBtn.onclick=()=>{musicEnabled=!musicEnabled;if(musicEnabled&&running&&!paused)startMusic();else stopMusic();updateAudioButtons();};
soundBtn.onclick=()=>{
  soundEnabled=!soundEnabled;
  if(!soundEnabled){try{for(const pool of Object.values(soundPools))pool.forEach(a=>a.pause());}catch(e){}}
  updateAudioButtons();
};
// 按鈕點擊音效（pointerdown 優先，避免同一次點擊播兩次）
let lastButtonPointerSound=0;
document.addEventListener('pointerdown',e=>{
  unlockAudio();
  const b=e.target.closest('button');
  if(b){lastButtonPointerSound=Date.now();if(b!==musicBtn&&b!==soundBtn)playClick();}
},true);
document.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(b&&b!==musicBtn&&b!==soundBtn&&Date.now()-lastButtonPointerSound>700)playClick();
},true);
// 切到背景 / 離開頁面：自動暫停並存檔
document.addEventListener('visibilitychange',()=>{if(!document.hidden){resumeCtx();flushQueue();}if(document.hidden){saveBest();if(running&&!paused)pauseGame();}});
window.addEventListener('pagehide',saveBest);
window.addEventListener('resize',()=>{updateMetrics();setPlayer(px);});
player.addEventListener('load',updateMetrics);

const ANN_KEY='airi-brie-ann-seen';
$('#annBody').textContent=ANN.body;$('#annTime').textContent='Ⓜ️最近更新時間 '+ANN.ver;
const annShow=()=>{annCard.hidden=false;};

if(!profile.seenUnlocked){profile.seenUnlocked=CHARS.filter(realUnlocked).map(c=>c.id);writeJSON(PROFILE_KEY,profile);}   // 更新前已達成的不當成「新解鎖」
$('#devBadge').hidden=!devMode;
updateAudioButtons();setPlayer(.5);
window.addEventListener('online',flushQueue);flushQueue();   // 開啟遊戲時，順便補傳上次沒傳成功的成績
